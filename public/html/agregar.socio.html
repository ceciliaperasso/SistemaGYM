                    <h1>Nuevo socio</h1>
                </header>

                <form class="member-form" id="form__agregar_socio">

                    <section class="form-section">
                        <h3>DATOS PERSONALES</h2>

                        <div class="grid-layout">

                            <div class="input-group">
                                <label for="nombre">Nombre*</label>
                                <input name="nombre" type="text" id="nombre" placeholder="Juan">
                            </div>

                            <div class="input-group">
                                <label for="apellido">Apellido*</label>
                                <input name="apellido" type="text" id="apellido" placeholder="Perez">
                            </div>

                            <div class="input-group icon-right">
                                <label for="dni">DNI / Documento*</label>
                                <input name="dni" type="text" id="dni" placeholder="32.145.678">
                            </div>

                            <div class="input-group icon-right">
                                <label for="fecha-nacimiento">Fecha de nacimiento</label>
                                <input name="fecha_nacimiento" type="date" id="fecha-nacimiento" placeholder="DD / MM / AAAA">
                            </div>
                        </div>
                    </section>

                    <section class="form-section">
                        <h3>INFORMACION DE CONTACTO</h2>

                        <div class="grid-layout">

                            <div class="input-group icon-right">
                                <label for="telefono">Télefono / WhatsApp</label>
                                <input name="telefono" type="tel" id="telefono" placeholder="+54 9 11 2345-6789">
                            </div>

                            <div class="input-group icon-right">
                                <label for="email">Correo Electronico</label>
                                <input name="email" type="email" id="email" placeholder="carlos.perez@gmail.com">
                            </div>

                            <div class="input-group icon-right">
                                <label for="email">Usuario en redes</label>
                                <input name="redes" type="text" id="redes" placeholder="@juanperez">
                            </div>

                        </div>
                    </section>

                    <section class="form-section">
                        <h3>ALTA Y PLAN</h2>
                        <div class="grid-layout">

                            <div class="input-group icon-right">
                                <label for="fecha-alta">Fecha dada de alta</label>
                                <input name="fecha_alta" type="date" id="fecha-alta" placeholder="DD / MM / AAAA">
                            </div>

                            <div class="input-group icon-right">
                                <label for="plan">Plan de Entrenamiento</label>
                                <div class="input-wrapper select-wrapper">
                                    <select name="id_plan" id="plan">
                                        <option value="1">1 día semanal   </option>
                                        <option value="2">2 días semanales</option>
                                        <option value="3">3 días semanales   </option>
                                        <option value="4">4/5 días semanales    </option>
                                        <option value="7">5 días semanales    </option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down"></i>
                                </div>
                            </div>


                        </div>
                    </section>

                    <div class="form-actions">
                        <button type="submit" class="btn">
                            <i class="fa-solid fa-user-plus"></i>
                            <span class="btn-texto">Registrar socio</span>
                        </button>
                        <button type="reset" class="btn btn-secundario">
                            <span class="btn-texto">Descartar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
