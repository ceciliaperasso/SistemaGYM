</head>
<body>
    <!-- Encabezado -->
    <header class="header">
        <div class="header-conteiner contenedor">
            <h2>Socios</h1>
            <h2>GYM <span class="azul">VG</span></h2>
        </div>
    </header>
    
    <main class="main">
        <div class="app-contenedor">
            <div class="form-section">
                <header class="form-header">
                    <a type="button" class="btn-back" aria-label="Volver" href="./socios.html">
                        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </a>

                    <h1>Nuevo socio</h1>
                </header>

                <form class="member-form" id="form__agregar_socio">

                    <section class="form-section">
                        <h3>DATOS PERSONALES</h2>

                        <div class="grid-layout">

                            <div class="input-group">
                                <label for="nombre">Nombre*</label>
                                <input type="text" id="nombre" placeholder="Juan">
                            </div>

                            <div class="input-group">
                                <label for="apellido">Apellido*</label>
                                <input type="text" id="apellido" placeholder="Perez">
                            </div>

                            <div class="input-group icon-right">
                                <label for="dni">DNI / Documento*</label>
                                <input type="text" id="dni" placeholder="32.145.678">
                            </div>

                            <div class="input-group icon-right">
                                <label for="fecha-nacimiento">Fecha de nacimiento</label>
                                <input type="text" id="fecha-nacimiento" placeholder="DD / MM / AAAA">
                            </div>
                        </div>
                    </section>

                    <section class="form-section">
                        <h3>INFORMACION DE CONTACTO</h2>

                        <div class="grid-layout">

                            <div class="input-group icon-right">
                                <label for="telefono">Télefono / WhatsApp</label>
                                <input type="tel" id="telefono" placeholder="+54 9 11 2345-6789">
                            </div>

                            <div class="input-group icon-right">
                                <label for="email">Correo Electronico</label>
                                <input type="email" id="email" placeholder="carlos.perez@gmail.com">
                            </div>

                            <div class="input-group icon-right">
                                <label for="email">Usuario en redes</label>
                                <input type="text" id="redes" placeholder="@juanperez">
                            </div>

                        </div>
                    </section>

                    <section class="form-section">
                        <h3>ALTA Y PLAN</h2>
                        <div class="grid-layout">

                            <div class="input-group icon-right">
                                <label for="fecha-alta">Fecha dada de alta</label>
                                <input type="text" id="fecha-alta" placeholder="DD / MM / AAAA">
                            </div>

                            <div class="input-group icon-right">
                                <label for="plan">Plan de Entrenamiento</label>
                                <div class="input-wrapper select-wrapper">
                                    <select id="plan">
                                        <option value="2-dias">Plan de 2 dias semanales</option>
                                        <option value="3-dias">Plan de 3 dias semanales</option>
                                        <option value="libre">Plan Libre</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down"></i>
                                </div>
                            </div>


                        </div>
                    </section>

                    <div class="form-actions">
                        <button type="submit" class="btn">
                            <i class="fa-solid fa-user-plus"></i>
                            <span class="btn-texto">Registrar socio</span>
                        </button>
                        <button type="reset" class="btn btn-secundario">
                            <span class="btn-texto">Descartar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
